<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Multitrack Player Experiment</title>
    <link rel="stylesheet" href="css/bard_outfit.css">
    <script src="js/bard_logic.js" defer></script>
</head>
<body>

<div class="player-card">
    <h2>Gem Mixer Pro</h2>
    
    <div class="controls">
        <label>Selecciona Canción:</label>
        <select id="songSelect">
            <option value="bard-dance">Danza del bardo</option>
            <option value="of-divinity-and-sin">De la divinidad y el pecado</option>
            <option value="old-time-battles">Viejas batallas</option>
            <option value="sing-for-me">Canta para mí</option>
            <option value="the-power">El poder</option>
            <option value="the-queens-high-seas">El mar de la Reina</option>
        </select>

        <button id="btnPlay">PLAY / PAUSE</button>
        <!-- Barra de Progreso -->
        <div id="progressBarBox">
            <input type="range" id="progressBar" value="0" min="0" step="0.1">
            <div id="songTime">
                <span id="currentTime">0:00</span>
                <span id="duration">0:00</span>
            </div>
        </div>
    </div>

    <div class="instruments-grid" id="mixer">
        <!-- Los instrumentos se generan aquí -->
    </div>
    
    <div class="status" id="status">Esperando interacción...</div>
</div>
</body>
</html>
